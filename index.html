<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f6b46">
  <title>Stock Out SC PDM</title>
  <style>
    :root{--green:#116b47;--green-dark:#0b5236;--mint:#eaf5ef;--ink:#17221d;--muted:#68746d;--line:#d9e2dc;--bg:#f3f7f4;--danger:#b42318;--shadow:0 18px 55px rgba(24,67,47,.11)}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(145deg,#edf6f0 0,#f8faf8 45%,#eef3ef 100%);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;min-height:100vh}
    button,input,select{font:inherit}
    .shell{width:min(1080px,calc(100% - 32px));margin:0 auto;padding:34px 0 56px}
    header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
    .mark{width:48px;height:48px;border-radius:15px;background:var(--green);color:white;display:grid;place-items:center;font-size:22px;font-weight:800;box-shadow:0 8px 18px rgba(17,107,71,.22)}
    h1{font-size:clamp(1.55rem,4vw,2.15rem);line-height:1.1;margin:0;letter-spacing:-.035em}
    .date{color:var(--muted);margin:4px 0 0;font-size:.92rem}
    .branch-bar{width:220px;margin:0 0 12px}
    .card{background:#fff;border:1px solid rgba(20,80,51,.11);border-radius:22px;box-shadow:var(--shadow);padding:26px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
    .field{display:flex;flex-direction:column;gap:8px;min-width:0}
    .field label{font-size:.9rem;font-weight:760}
    .field small{color:var(--muted);font-size:.78rem;line-height:1.4}
    .calculated{color:var(--green-dark)!important;font-weight:750;min-height:1.1em}
    .control{width:100%;height:52px;border:1px solid #cbd6cf;border-radius:13px;background:#fff;color:var(--ink);padding:0 14px;outline:none;transition:border-color .18s,box-shadow .18s}
    .control:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(17,107,71,.12)}
    .item-controls{display:grid;gap:9px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
    .btn{border:0;border-radius:12px;min-height:46px;padding:0 18px;font-weight:760;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,filter .15s}
    .btn:active{transform:translateY(1px)}
    .btn-primary{background:var(--green);color:white}
    .btn-primary:hover{filter:brightness(.93)}
    .btn-quiet{background:#edf2ef;color:#34423a}
    .btn-pickup{background:#e7f1ec;color:var(--green-dark)}
    .btn-copy{background:#263b31;color:white}
    .btn-pdf{background:#b42318;color:white}
    .btn-whatsapp{background:#1fa855;color:white}
    .summary{margin-top:22px}
    .summary-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:12px}
    h2{font-size:1.15rem;margin:0;letter-spacing:-.015em}
    .totals{color:var(--muted);font-size:.86rem;text-align:right}
    .empty{border:1px dashed #c9d7ce;border-radius:16px;padding:30px;text-align:center;color:var(--muted);background:#fafcfb}
    .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px}
    table{width:100%;border-collapse:collapse;min-width:760px}
    th,td{text-align:left;padding:13px 14px;border-bottom:1px solid #e7ede9;vertical-align:middle}
    th{font-size:.77rem;text-transform:uppercase;letter-spacing:.04em;color:#637168;background:#f5f8f6}
    tbody tr:last-child td{border-bottom:0}
    .item-name{font-weight:750}
    .kg-pill{display:inline-block;margin-top:4px;background:var(--mint);color:var(--green-dark);border-radius:999px;padding:3px 9px;font-size:.79rem;font-weight:750}
    .delete{border:0;background:#fff0ee;color:var(--danger);width:35px;height:35px;border-radius:10px;font-weight:800;cursor:pointer}
    .share-row{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
    .modal{position:fixed;inset:0;background:rgba(12,25,18,.58);display:grid;place-items:center;padding:18px;z-index:20}
    .modal[hidden]{display:none}
    .modal-card{width:min(470px,100%);background:#fff;border-radius:20px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.28)}
    .modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .modal-head h2{font-size:1.25rem}
    .modal-close{width:38px;height:38px;border:0;border-radius:10px;background:#edf2ef;color:#34423a;font-size:1.35rem;cursor:pointer}
    .modal-fields{display:grid;gap:15px}
    .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
    .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#1f2c25;color:white;padding:11px 16px;border-radius:11px;opacity:0;pointer-events:none;transition:.22s;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:10}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:680px){
      .shell{width:min(100% - 20px,560px);padding:18px 0 32px}
      header{margin:0 4px 15px}.mark{width:43px;height:43px;border-radius:13px}
      .branch-bar{width:100%}
      .card{padding:17px;border-radius:18px}.form-grid{grid-template-columns:1fr;gap:15px}
      .actions{display:grid;grid-template-columns:1fr 1fr}.btn{padding:0 12px}
      .summary-head{align-items:flex-start}.totals{font-size:.8rem}
      .table-wrap{border:0;overflow:visible}
      table,thead,tbody,tr,td{display:block;min-width:0}
      thead{display:none}
      tbody{display:grid;gap:11px}
      tr{position:relative;border:1px solid var(--line);border-radius:14px;padding:13px 48px 12px 13px;background:#fff}
      td{border:0;padding:3px 0;font-size:.9rem}
      td::before{content:attr(data-label);display:inline-block;min-width:84px;color:var(--muted);font-size:.76rem}
      td:first-child::before,td:last-child::before{display:none}
      td:first-child{padding-bottom:7px}.delete-cell{position:absolute;right:11px;top:11px}
      .share-row{flex-direction:column}
      .share-row .btn{width:100%}
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="mark" aria-hidden="true">SC</div>
      <div><h1>Stock Out SC PDM</h1><p class="date" id="today"></p></div>
    </header>
    <div class="field branch-bar">
      <label for="branch">Branch</label>
      <select class="control" id="branch">
        <option selected>MGP</option>
        <option>DVP</option>
        <option>SK1</option>
        <option>SK2</option>
      </select>
    </div>
    <section class="card" aria-label="Stock out form">
      <form id="stockForm">
        <div class="form-grid">
          <div class="field">
            <label for="itemSelect">Items</label>
            <div class="item-controls">
              <select class="control" id="itemSelect">
                <option value="">-- Select Item --</option>
                <option>BAWANG BESAR MERAH INDIA (AAA)</option>
                <option>BAWANG BESAR MERAH INDIA</option>
                <option>BAWANG BESAR MERAH CHINA</option>
                <option>UBI GUNI CHINA</option>
                <option>UBI KOTAK CHINA</option>
                <option>BAWANG KUNING CHINA 60/80</option>
                <option>CILI KERING INDIA</option>
                <option>CILI KERING CHINA</option>
                <option>KACANG TANAH</option>
              </select>
              <input class="control" id="manualItem" type="text" placeholder="Or type item manually" autocomplete="off">
            </div>
            <small>Select from the list, or type a new item manually.</small>
          </div>
          <div class="field">
            <label for="kg">KG</label>
            <input class="control" id="kg" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="e.g. 10 KG" required>
            <small>Weight for each unit or package.</small>
            <label for="price">Price (RM)</label>
            <input class="control" id="price" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="e.g. 25.50">
          </div>
          <div class="field">
            <label for="quantity">Quantity</label>
            <input class="control" id="quantity" type="text" inputmode="decimal" placeholder="e.g. 480 or 120 x 4" autocomplete="off" required>
            <small class="calculated" id="quantityResult" aria-live="polite"></small>
          </div>
          <div class="field">
            <label for="container">No. Container</label>
            <input class="control" id="container" type="text" placeholder="e.g. ABCD1234567" autocomplete="off">
          </div>
          <div class="field" style="grid-column:1/-1">
            <label for="remarks">Remarks</label>
            <input class="control" id="remarks" type="text" placeholder="e.g. Sales / Damage / Transfer" autocomplete="off">
          </div>
        </div>
        <div class="actions">
          <button class="btn btn-primary" type="submit">＋ Add Stock Out</button>
          <button class="btn btn-quiet" id="clearBtn" type="button">Clear All</button>
          <button class="btn btn-pickup" id="pickupBtn" type="button">Pickup Detail</button>
        </div>
      </form>
      <div class="summary">
        <div class="summary-head">
          <h2>Stock Out Summary</h2>
          <div class="totals"><span id="totalLines">0 items</span> · Total Qty: <strong id="totalQty">0</strong></div>
        </div>
        <div class="empty" id="empty">No stock out items added yet.</div>
        <div class="table-wrap" id="tableWrap" hidden>
          <table>
            <thead><tr><th>Items</th><th>Quantity</th><th>Price</th><th>Remarks</th><th>No. Container</th><th></th></tr></thead>
            <tbody id="summaryBody"></tbody>
          </table>
        </div>
        <div class="share-row">
          <button class="btn btn-pdf" id="pdfBtn" type="button">Save PDF</button>
          <button class="btn btn-copy" id="copyBtn" type="button">Copy Stock Out</button>
          <button class="btn btn-whatsapp" id="whatsappBtn" type="button">Share to WhatsApp</button>
        </div>
      </div>
    </section>
  </main>
  <div class="modal" id="pickupModal" role="dialog" aria-modal="true" aria-labelledby="pickupTitle" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="pickupTitle">Pickup Detail</h2>
        <button class="modal-close" id="closePickup" type="button" aria-label="Close">×</button>
      </div>
      <div class="modal-fields">
        <div class="field">
          <label for="lorryNumber">Lorry Number</label>
          <input class="control" id="lorryNumber" type="text" placeholder="e.g. VAB 1234" autocomplete="off">
        </div>
        <div class="field">
          <label for="driverName">Driver Name</label>
          <input class="control" id="driverName" type="text" placeholder="e.g. Ahmad" autocomplete="off">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-quiet" id="cancelPickup" type="button">Cancel</button>
        <button class="btn btn-primary" id="savePickup" type="button">Save Detail</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const $ = (id) => document.getElementById(id);
    const clean = (value) => String(value ?? "").trim();
    const STORAGE_KEY = "stockOutScPdmV2";
    const META_KEY = "stockOutScPdmMetaV1";
    let rows = [];
    let pickup = {lorryNumber:"",driverName:""};
    try { rows = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); if (!Array.isArray(rows)) rows = []; } catch { rows = []; }
    try {
      const meta=JSON.parse(localStorage.getItem(META_KEY) || "{}");
      pickup={lorryNumber:clean(meta.lorryNumber),driverName:clean(meta.driverName)};
      if(["MGP","DVP","SK1","SK2"].includes(meta.branch)) $("branch").value=meta.branch;
    } catch {}
    const today = new Intl.DateTimeFormat("en-GB",{day:"2-digit",month:"2-digit",year:"numeric"}).format(new Date());
    $("today").textContent = "Date: " + today;

    const escapeHtml = (value) => clean(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
    const numberText = (value) => Number(value).toLocaleString("en-MY",{maximumFractionDigits:2});
    const moneyText = (value) => Number(value).toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2});
    function saveMeta(){
      localStorage.setItem(META_KEY,JSON.stringify({branch:$("branch").value,...pickup}));
      $("pickupBtn").textContent = pickup.lorryNumber || pickup.driverName ? "Pickup Detail ✓" : "Pickup Detail";
    }
    function calculateQuantity(value){
      const input=clean(value);
      if(/^\d+(?:\.\d+)?$/.test(input)) return Number(input);
      const match=input.match(/^(\d+(?:\.\d+)?)\s*[xX×]\s*(\d+(?:\.\d+)?)$/);
      return match ? Number(match[1])*Number(match[2]) : NaN;
    }
    function toast(message){ $("toast").textContent=message; $("toast").classList.add("show"); setTimeout(()=>$("toast").classList.remove("show"),1800); }
    function save(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(rows)); render(); }
    function render(){
      $("empty").hidden = rows.length > 0;
      $("tableWrap").hidden = rows.length === 0;
      $("summaryBody").innerHTML = rows.map((row,index) => `
        <tr>
          <td><div class="item-name">${escapeHtml(row.item)}</div><span class="kg-pill">${numberText(row.kg)} KG</span></td>
          <td data-label="Quantity">${numberText(row.quantity)}</td>
          <td data-label="Price">${row.price ? "RM "+moneyText(row.price) : "—"}</td>
          <td data-label="Remarks">${escapeHtml(row.remarks) || "—"}</td>
          <td data-label="Container">${escapeHtml(row.container) || "—"}</td>
          <td class="delete-cell"><button class="delete" type="button" data-delete="${index}" aria-label="Delete ${escapeHtml(row.item)}">×</button></td>
        </tr>`).join("");
      $("totalLines").textContent = rows.length + (rows.length === 1 ? " item" : " items");
      $("totalQty").textContent = numberText(rows.reduce((sum,row)=>sum+Number(row.quantity||0),0));
    }
    $("itemSelect").addEventListener("change",()=>{ if($("itemSelect").value) $("manualItem").value=""; });
    $("manualItem").addEventListener("input",()=>{ if(clean($("manualItem").value)) $("itemSelect").value=""; });
    $("branch").addEventListener("change",saveMeta);
    $("quantity").addEventListener("input",()=>{
      const input=clean($("quantity").value), quantity=calculateQuantity(input);
      $("quantityResult").textContent = /[xX×]/.test(input) && quantity>0 ? "Calculated Qty: "+numberText(quantity) : "";
    });
    $("stockForm").addEventListener("submit",(event)=>{
      event.preventDefault();
      const item = clean($("manualItem").value) || clean($("itemSelect").value);
      const kg = Number($("kg").value), quantity = calculateQuantity($("quantity").value);
      const priceInput=clean($("price").value), price=priceInput ? Number(priceInput) : null;
      if(!item){ toast("Please select or enter an item."); $("itemSelect").focus(); return; }
      if(!(kg>0)){ toast("Please enter KG."); $("kg").focus(); return; }
      if(!(quantity>0)){ toast("Enter quantity as 480 or 120 x 4."); $("quantity").focus(); return; }
      if(priceInput && !(price>0)){ toast("Please enter a valid price."); $("price").focus(); return; }
      rows.push({item,kg,quantity,price,remarks:clean($("remarks").value),container:clean($("container").value)});
      save(); event.target.reset(); $("quantityResult").textContent=""; $("itemSelect").focus(); toast("Stock out added.");
    });
    $("summaryBody").addEventListener("click",(event)=>{
      const button=event.target.closest("[data-delete]"); if(!button)return;
      rows.splice(Number(button.dataset.delete),1); save();
    });
    $("clearBtn").addEventListener("click",()=>{
      if(!rows.length)return;
      if(confirm("Clear all stock out items?")){ rows=[]; save(); toast("All items cleared."); }
    });
    function openPickup(){
      $("lorryNumber").value=pickup.lorryNumber;
      $("driverName").value=pickup.driverName;
      $("pickupModal").hidden=false;
      setTimeout(()=>$("lorryNumber").focus(),0);
    }
    function closePickup(){ $("pickupModal").hidden=true; }
    $("pickupBtn").addEventListener("click",openPickup);
    $("closePickup").addEventListener("click",closePickup);
    $("cancelPickup").addEventListener("click",closePickup);
    $("pickupModal").addEventListener("click",(event)=>{ if(event.target===$("pickupModal")) closePickup(); });
    document.addEventListener("keydown",(event)=>{ if(event.key==="Escape" && !$("pickupModal").hidden) closePickup(); });
    $("savePickup").addEventListener("click",()=>{
      pickup={lorryNumber:clean($("lorryNumber").value),driverName:clean($("driverName").value)};
      saveMeta(); closePickup(); toast("Pickup detail saved.");
    });
    function stockOutText(){
      const lines=["*STOCK OUT - "+$("branch").value+"*","*Date: "+today+"*",""];
      if(pickup.lorryNumber || pickup.driverName){
        lines.push("*Pickup Detail*");
        if(pickup.lorryNumber) lines.push("Lorry Number: "+pickup.lorryNumber);
        if(pickup.driverName) lines.push("Driver Name: "+pickup.driverName);
        lines.push("");
      }
      rows.forEach(row=>{
        lines.push("•"+row.item+" "+numberText(row.kg)+" KG - "+numberText(row.quantity));
        if(row.price) lines.push("RM "+moneyText(row.price));
        lines.push("");
      });
      if(lines[lines.length-1]==="") lines.pop();
      return lines.join("\n");
    }
    function savePdf(){
      if(!rows.length){ toast("Add at least one item first."); return; }
      const customers={
        MGP:"SC. MGP. SG. BULOH",
        DVP:"SC DATARAN VILLA PUTRA",
        SK1:"SC SERI KEMBANGAN 1",
        SK2:"SC SERI KEMBANGAN 2"
      };
      const now=new Date();
      const printDate=new Intl.DateTimeFormat("en-GB",{day:"2-digit",month:"2-digit",year:"numeric"}).format(now);
      const printDay=new Intl.DateTimeFormat("en-US",{weekday:"long"}).format(now).toUpperCase();
      const printDateFull=printDate+" ("+printDay+")";
      const printTime=new Intl.DateTimeFormat("en-MY",{hour:"2-digit",minute:"2-digit",hour12:true}).format(now).toUpperCase();
      const rowCount=Math.max(10,rows.length);
      const tableRows=Array.from({length:rowCount},(_,index)=>{
        const row=rows[index];
        return row ? `<tr>
          <td>${index+1}</td>
          <td>${escapeHtml(row.item)}</td>
          <td>${numberText(row.kg)} KG</td>
          <td>${numberText(row.quantity)}</td>
          <td>${row.price ? moneyText(row.price) : ""}</td>
        </tr>` : `<tr><td>${index+1}</td><td></td><td></td><td></td><td></td></tr>`;
      }).join("");

      popup.document.write(`<!doctype html>
<html><head><meta charset="utf-8"><title>PDM IMPORT STOCK OUT - ${printDate.replaceAll("/","-")}</title>
<style>
  @page{size:A4 landscape;margin:10mm}
  *{box-sizing:border-box}
  body{margin:0;color:#111;font-family:Arial,Helvetica,sans-serif;font-size:12px}
  .sheet{width:100%}
  .top{display:grid;grid-template-columns:165px 1fr;gap:18px;align-items:start}
  .logo{width:145px;height:145px;object-fit:cover}
  .top-content{min-width:0}
  h1{text-align:center;font-size:32px;letter-spacing:1px;margin:8px 0 28px}
  .meta-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.85fr);gap:22px}
  .details{display:grid;gap:12px}
  .line{display:grid;grid-template-columns:112px 12px 1fr;gap:4px;align-items:end}
  .line strong{font-size:12px}
  .value{border-bottom:1px solid #111;min-height:18px;padding:0 4px 3px}
  .pickup-title{font-weight:800;font-size:16px;line-height:18px;margin:0 0 12px}
  table{width:100%;border-collapse:collapse;margin-top:18px;table-layout:fixed}
  th,td{border:1px solid #111;padding:6px 7px;height:28px}
  th{text-align:center;font-size:12px}
  td:nth-child(1),td:nth-child(3),td:nth-child(4),td:nth-child(5){text-align:center}
  th:nth-child(1){width:7%}
  th:nth-child(2){width:52%}
  th:nth-child(3){width:9%}
  th:nth-child(4){width:17%}
  th:nth-child(5){width:15%}
  .footer{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;margin-top:18px}
  .remarks{font-weight:700;min-height:62px}
  .footer-lines{display:grid;gap:14px}
  .footer-lines .line{grid-template-columns:100px 12px 1fr}
  @media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head>
<body><div class="sheet">
  <div class="top">
    <div><img class="logo" src="${logoUrl}" alt="SC Wholesale"></div>
    <div class="top-content">
      <h1>PDM IMPORT STOCK OUT</h1>
      <div class="meta-grid">
        <div class="details">
          <div class="line"><strong>Date Stock Out</strong><span>:</span><div class="value">${printDateFull}</div></div>
          <div class="line"><strong>Time Stock Out</strong><span>:</span><div class="value">${printTime}</div></div>
          <div class="line"><strong>Customer Name</strong><span>:</span><div class="value">${escapeHtml(customers[$("branch").value])}</div></div>
        </div>
        <div>
          <div class="pickup-title">PICKUP DETAILS :</div>
          <div class="details">
            <div class="line"><strong>Lorry No.</strong><span>:</span><div class="value">${escapeHtml(pickup.lorryNumber)}</div></div>
            <div class="line"><strong>Driver Name</strong><span>:</span><div class="value">${escapeHtml(pickup.driverName)}</div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <table>
    <thead><tr><th>No.</th><th>Item Description</th><th>KG</th><th>Quantity</th><th>Unit Price<br>(RM)</th></tr></thead>
    <tbody>${tableRows}</tbody>
  </table>
  <div class="footer">
    <div class="remarks">** REMARKS: ${escapeHtml(remarks)}</div>
    <div class="footer-lines">
      <div class="line"><strong>SI Posted By</strong><span>:</span><div class="value"></div></div>
      <div class="line"><strong>SI No.</strong><span>:</span><div class="value"></div></div>
    </div>
  </div>
</div>
</body></html>`);
      popup.document.close();
      popup.addEventListener("load",()=>setTimeout(()=>popup.print(),250),{once:true});
    }
    $("pdfBtn").addEventListener("click",savePdf);
    $("copyBtn").addEventListener("click",async()=>{
      if(!rows.length){ toast("Add at least one item first."); return; }
      const text=stockOutText();
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const area=document.createElement("textarea");
        area.value=text; area.style.position="fixed"; area.style.opacity="0";
        document.body.appendChild(area); area.select(); document.execCommand("copy"); area.remove();
      }
      toast("Stock out copied.");
    });
    $("whatsappBtn").addEventListener("click",()=>{
      if(!rows.length){ toast("Add at least one item first."); return; }
      const text=encodeURIComponent(stockOutText());
      const agent=navigator.userAgent || "";
      if(/Android/i.test(agent)){
        window.location.href="intent://send?text="+text+"#Intent;scheme=whatsapp;package=com.whatsapp;end";
      } else if(/iPhone|iPad|iPod/i.test(agent)){
        window.location.href="whatsapp://send?text="+text;
      } else {
        window.open("https://web.whatsapp.com/send?text="+text,"_blank","noopener,noreferrer");
      }
    });
    saveMeta();
    render();
  </script>
</body>
</html>
